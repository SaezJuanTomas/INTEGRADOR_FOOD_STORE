<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store | Productos</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="page-shell">
    <main class="card content-card">
      <header class="page-header">
        <div>
          <p class="eyebrow">CRUD de productos</p>
          <h1>Productos</h1>
        </div>
        <div class="header-actions">
          <a class="button button-secondary" href="menu.html">Volver al menú</a>
          <button class="button button-primary" id="newProductoBtn" type="button">Nuevo producto</button>
        </div>
      </header>

      <section class="controls-card">
        <div class="filters-grid">
          <label>
            Buscar por texto
            <input type="search" id="productoFilterText" placeholder="Nombre o descripción" />
          </label>

          <label>
            Categoría ID
            <input type="number" id="productoFilterCategoria" min="1" placeholder="Todas" />
          </label>

          <label>
            Disponible
            <select id="productoFilterDisponible">
              <option value="all">Todos</option>
              <option value="yes">Sí</option>
              <option value="no">No</option>
            </select>
          </label>
        </div>

        <div class="filters-actions">
          <button class="button button-secondary small-button" id="productoResetFiltersBtn" type="button">Limpiar filtros</button>
          <span id="productosFilteredLabel" class="muted"></span>
        </div>
      </section>

      <form id="productoForm" class="form-grid hidden">
        <input type="hidden" id="productoId" />

        <div class="split-grid">
          <label>
            Nombre
            <input type="text" id="productoNombre" required maxlength="150" />
          </label>

          <label>
            Precio base
            <input type="number" id="productoPrecio" min="0" step="0.01" required />
          </label>
        </div>

        <label>
          Descripción
          <textarea id="productoDescripcion" rows="3"></textarea>
        </label>

        <div class="split-grid">
          <label>
            URL de imagen
            <input type="text" id="productoImagen" />
          </label>

          <label>
            Tiempo prep (min)
            <input type="number" id="productoTiempo" min="0" />
          </label>
        </div>

        <div class="split-grid">
          <label>
            Categoría ID
            <input type="number" id="productoCategoriaId" min="1" />
          </label>

          <label>
            Ingredientes IDs (separados por coma)
            <input type="text" id="productoIngredientesIds" placeholder="1,2,3" />
          </label>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="productoDisponible" checked />
          Disponible
        </label>

        <div class="form-actions">
          <button class="button button-primary" type="submit">Guardar</button>
          <button class="button button-secondary" id="cancelProductoBtn" type="button">Cancelar</button>
        </div>
      </form>

      <section class="table-card">
        <div class="table-header">
          <h2>Listado</h2>
          <span id="productosTotalLabel" class="muted"></span>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría ID</th>
                <th>Disponible</th>
                <th>Ingredientes</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productosTableBody"></tbody>
          </table>
        </div>

        <div class="pagination-bar">
          <button class="button button-secondary small-button" id="productosPrevPageBtn" type="button">Anterior</button>
          <span id="productosPageInfo" class="pagination-info"></span>
          <button class="button button-secondary small-button" id="productosNextPageBtn" type="button">Siguiente</button>
        </div>
      </section>

      <p id="productosMessage" class="feedback" aria-live="polite"></p>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/list-utils.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/productos.js"></script>
  </body>
</html>
